name: 建置 Windows 版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 桌面啟動測試
        run: npm run test:desktop

      - name: 安裝繁體中文 OCR 與測試字型
        timeout-minutes: 30
        shell: powershell
        run: .\scripts\install-windows-ocr.ps1

      - name: Windows 繁體中文圖片辨識測試
        run: node scripts/test-windows-ocr.mjs
        env:
          OCR_LOG_DIR: ocr-logs

      - name: 建置 Windows 安裝檔與免安裝檔
        run: npm run desktop:win

      - name: 安裝後煙霧測試
        id: installed-smoke-test
        timeout-minutes: 5
        run: node scripts/test-windows-installed.mjs
        env:
          SMOKE_LOG_DIR: smoke-logs
          OCR_LOG_DIR: ocr-logs

      - name: 上傳煙霧測試診斷資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows-smoke-logs
          path: smoke-logs
          if-no-files-found: warn

      - name: 上傳 OCR 診斷資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows-ocr-logs
          path: ocr-logs
          if-no-files-found: warn

      - name: 上傳 Windows 元件安裝記錄
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows-capability-logs
          path: C:/Windows/Logs/DISM/dism.log
          if-no-files-found: warn

      - name: 上傳 EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows
          path: dist/*.exe
          if-no-files-found: error
