name: 建置 Windows 版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 建置 Windows 安裝檔與免安裝檔
        run: npm run desktop:win

      - name: 上傳 EXE
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows
          path: dist/*.exe
          if-no-files-found: error
