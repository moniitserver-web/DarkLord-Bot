name: 建置 Windows 版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 桌面啟動測試
        run: npm run test:desktop

      - name: 安裝繁體中文 OCR 與測試字型
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pattern in @('Language.Basic~~~zh-TW~*', 'Language.OCR~~~zh-TW~*', 'Language.Fonts.Hant~~~*')) {
            $capability = Get-WindowsCapability -Online | Where-Object Name -like $pattern | Select-Object -First 1
            if (-not $capability) { throw "Windows does not provide capability $pattern" }
            if ($capability.State -ne 'Installed') { Add-WindowsCapability -Online -Name $capability.Name }
          }

      - name: Windows 繁體中文圖片辨識測試
        run: node scripts/test-windows-ocr.mjs
        env:
          OCR_LOG_DIR: ocr-logs

      - name: 建置 Windows 安裝檔與免安裝檔
        run: npm run desktop:win

      - name: 安裝後煙霧測試
        id: installed-smoke-test
        timeout-minutes: 5
        run: node scripts/test-windows-installed.mjs
        env:
          SMOKE_LOG_DIR: smoke-logs
          OCR_LOG_DIR: ocr-logs

      - name: 上傳煙霧測試診斷資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows-smoke-logs
          path: smoke-logs
          if-no-files-found: warn

      - name: 上傳 OCR 診斷資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows-ocr-logs
          path: ocr-logs
          if-no-files-found: warn

      - name: 上傳 EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darklord-bot-windows
          path: dist/*.exe
          if-no-files-found: error
