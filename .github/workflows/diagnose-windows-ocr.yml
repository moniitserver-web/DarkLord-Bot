name: Windows OCR 環境診斷

on:
  workflow_dispatch:
  push:
    branches: [codex/fix-tw-screen-data]
    paths: [.github/workflows/diagnose-windows-ocr.yml]

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 列出 OCR 與語言元件狀態
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber
          Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Language.*zh-TW*' -or $_.Name -like 'Language.Fonts.Hant*' } | Format-Table Name,State
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'electron/windows-ocr.ps1'), [Text.Encoding]::UTF8)
          $script = Join-Path $env:RUNNER_TEMP 'darklord-ocr-diagnostics.ps1'
          [IO.File]::WriteAllText($script, $source, (New-Object Text.UTF8Encoding($true)))
          & $script -Diagnostics
