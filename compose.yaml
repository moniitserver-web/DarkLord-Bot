services:
  darklord:
    build:
      context: .
      target: runtime
    image: darklord-bot:local
    ports:
      - "127.0.0.1:3002:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    init: true
